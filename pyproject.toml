[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenrank"
version = "0.1.0"
description = "Rank scheduled food-safety inspections by the chance of a critical violation and measure what re-ordering buys"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "ranx>=0.3.20",
  "ruptures>=1.1.9",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "gradio>=5.0",
]

[project.optional-dependencies]
ingest = ["rdata>=0.11"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
kitchenrank = "kitchenrank.pipeline:main"
kitchenrank-app = "kitchenrank.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::RuntimeWarning", "ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
